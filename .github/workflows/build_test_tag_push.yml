name: Build and push image to ECR

on:
  workflow_call:
    outputs:
      TAG:
        description: "image tag"
        value: ${{ jobs.build.outputs.TAG }}
    inputs:
      repo_name:
        required: true
        type: string
      # chart_folder:
      #   required: false
        # type: string
        # default: chart
      tag_suffix:
        required: false
        type: string
      project_working_dir:
        required: false
        type: string
        default: "./"
      img_working_dir:
        required: false
        type: string
        default: "/opt/ambiente"
      run_tests:
        required: false
        type: boolean
        default: true
      test_name:
        required: false
        type: string
        default: "test_docker"
    secrets:
      db_password:
        required: false
      role_aws:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.vars.outputs.tag }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
      id-token: write

    env:
      AWS_REGION: us-east-2
      ACCOUNT_SHARED: "309615786676"
      APPLICATION_NAME: ${{ inputs.repo_name }}
      REPO_NAME: ${{ inputs.repo_name }}
      TAG_SUFFIX: ${{ inputs.tag_suffix }}
      IMG_WORKING_DIR: ${{ inputs.img_working_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Read Helm Chart
      #   id: chart
      #   uses: jacobtomlinson/gha-read-helm-chart@master
      #   with:
      #     path: ${{ inputs.project_working_dir }}${{ env.CHART_FOLDER }}  

      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)${{ env.TAG_SUFFIX }}" >> $GITHUB_OUTPUT


      - name: Build image
        id: build
        env:
          IMAGE_NAME: ${{ env.REPO_NAME }}:${{ steps.vars.outputs.tag }}
        run: |
          cd ${{ inputs.project_working_dir }}
          docker build -t ${{ env.IMAGE_NAME }} .

      - name: Run tests
        if: ${{ inputs.run_tests }}
        id: tests
        run: |
          docker build -t ${{ env.REPO_NAME }}db docker-db/.
          docker volume create tests
          docker network create ${{ env.REPO_NAME }}net
          docker run -d --network ${{ env.REPO_NAME }}net --name ${{ env.REPO_NAME }}db ${{ env.REPO_NAME }}db:latest

          mkdir -p ${{ github.workspace }}/test-results
          docker run --mount type=bind,source=${{ github.workspace }}/test-results,target=${{ env.IMG_WORKING_DIR }}/${{ env.REPO_NAME }}/tests-results/ \
            --network ${{ env.REPO_NAME }}net --name ${{ env.REPO_NAME }} \
            --env DB_HOST=${{ env.REPO_NAME }}db \
            --env DB_USER=postgres \
            --env DB_PASSWORD=${{ secrets.db_password }} \
            --entrypoint fab ${{ env.REPO_NAME }}:${{ steps.vars.outputs.tag }} ${{ inputs.test_name }}

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action/composite@v1
        if: ${{ inputs.run_tests }}
        with:
          report_individual_runs: "true"
          files: "**/test-results/*.xml"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role_aws }}
          role-session-name: GitHubAction
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Assume CIDeployAccess
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_SHARED }}:role/CIDeployAccess
          role-session-name: CIDeploySession
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Tag and push image to shared ECR
        env:
          LOCAL_IMAGE: ${{ env.REPO_NAME }}:${{ steps.vars.outputs.tag }}
          IMAGE_URI: ${{ env.ACCOUNT_SHARED }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APPLICATION_NAME }}:${{ steps.vars.outputs.tag }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ACCOUNT_SHARED }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

          docker tag $LOCAL_IMAGE $IMAGE_URI
          docker push $IMAGE_URI
